name: liquid_glass_bottom_navigator
description: A floating liquid-glass bottom navigation bar with a spring-animated selection indicator.
version: 1.2.0
repository: https://github.com/K-Almahamid/liquid_glass_bottom_navigator
homepage: https://github.com/K-Almahamid/liquid_glass_bottom_navigator
issue_tracker: https://github.com/K-Almahamid/liquid_glass_bottom_navigator/issues

topics:
  - navigation
  - ui
  - widgets

environment:
  sdk: ^3.13.4
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

screenshots:
  - description: Light refractive glass over the inbox, with Inbox selected.
    path: screenshots/light-expanded.png
  - description: Dark refractive glass over the same inbox, with Inbox selected.
    path: screenshots/dark-expanded.png

flutter:
  shaders:
    - shaders/liquid_glass_refraction.frag
